<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Product Detail</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/detail.css" />
</head>
<body>
    <header> 
        <nav> 
            <div class="subnav">
                <button class="subnavbtn">
                    <img src="/assets/menu_bars.svg" alt="Menu Bars" />
                </button>
                <div class="subnav-content">
                    <a href="/index.html">Home</a>
                    <a href="/pages/about.html">About</a>
                    <a href="/pages/menu.html">Menu</a>
                    <a href="/pages/events.html">Events</a>
                    <a href="/pages/locations.html">Locations</a>
                    <a href="/pages/shop.html">Shop</a>
                    <a href="/pages/faq.html">FAQ</a>
                    <a href="/pages/contact.html">Contact</a>
                </div>
            </div>
            <h1> BILLY VAN CREAMY  </h1>
            <div class="search-cart">
                <img src="/assets/search.svg" alt="Search" />
                <div class="cart-icon-wrapper">
                    <img src="/assets/cart.svg" alt="Shopping Cart" onclick="openDrawer()" style="cursor:pointer;" />
                    <span id="cart-badge" style="display:none;">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="detail-page">
        <div class="detail-layout">
            <div class="detail-left">
                <img id="detail-img" src="" alt="" class="detail-img" />
            </div>
            <div class="detail-right">
                <div class="detail-top-row">
                    <h1 id="detail-title"></h1>
                </div>
                <div class="detail-meta">
                    <span id="detail-price"></span>
                    <span id="detail-serves"></span>
                </div>
                <div class="ordering">
                    <div class="quantity-selector">
                        <button class="qty-btn" onclick="changeQty(-1)">−</button>
                        <span id="qty-display">1</span>
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <button class="order-btn" id="order-btn" onclick="openPopup()">Place Order</button>
                </div>
                <p id="detail-desc"></p>
            </div>
        </div>
        <div id="order-popup" class="popup-overlay">
        <div class="popup-box">
            <button class="popup-close" onclick="closePopup()">✕</button>
            <h2>Choose a Pickup Date</h2>
            <p>Select the date you'd like your cake ready for.</p>
            <input type="date" id="pickup-date" class="date-input" />
            <button class="confirm-btn" onclick="confirmOrder()">Confirm Order</button>
        </div>
    </div>

    <div id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-header">
        <h2>Your Cart</h2>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div id="cart-drawer-items" class="cart-drawer-items"></div>
    <div class="cart-drawer-footer">
        <a href="/pages/cart.html" class="view-cart-btn">View Cart</a>
    </div>
</div>
<div id="cart-overlay" class="cart-overlay" onclick="closeDrawer()"></div>
    </main>
    
<script src="../scripts/scripts.js"></script>
</body>


</html>
