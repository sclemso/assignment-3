<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Product Detail</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/detail.css" />
</head>
<body>
    <header> 
        <nav> 
            <div class="subnav">
                <button class="subnavbtn">
                    <img src="/assets/menu_bars.svg" alt="Menu Bars" />
                </button>
                <div class="subnav-content">
                    <a href="/index.html">Home</a>
                    <a href="/pages/about.html">About</a>
                    <a href="/pages/menu.html">Menu</a>
                    <a href="/pages/events.html">Events</a>
                    <a href="/pages/locations.html">Locations</a>
                    <a href="/pages/shop.html">Shop</a>
                    <a href="/pages/faq.html">FAQ</a>
                    <a href="/pages/contact.html">Contact</a>
                </div>
            </div>
            <h1> BILLY VAN CREAMY  </h1>
            <div class="search-cart">
                <img src="/assets/search.svg" alt="Search" />
                <img src="/assets/cart.svg" alt="Shopping Cart" />
            </div>
        </nav>
    </header>

    <main class="detail-page">
        <div class="detail-layout">
            <div class="detail-left">
                <img id="detail-img" src="" alt="" class="detail-img" />
            </div>
            <div class="detail-right">
                <div class="detail-top-row">
                    <h1 id="detail-title"></h1>
                </div>
                <div class="detail-meta">
                    <span id="detail-price"></span>
                    <span id="detail-serves"></span>
                </div>
                <div class="ordering">
                    <div class="quantity-selector">
                        <button class="qty-btn" onclick="changeQty(-1)">−</button>
                        <span id="qty-display">1</span>
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <button class="order-btn" id="order-btn"></button>
                </div>
                <p id="detail-desc"></p>
            </div>
        </div>
    </main>
    <script src="/scripts/scripts.js"></script>
</body>
