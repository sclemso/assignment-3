<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Home Page</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/cart.css" />
    <link rel="stylesheet" href="/styles/colors.css" />
    <link rel="stylesheet" href="/styles/typography.css" />
</head>
<body>
    <header> 
        <nav> 
            <div class="subnav">
                <button class="subnavbtn">
                    <img src="/assets/menu_bars.svg" alt="Menu Bars" />
                </button>
                <div class="subnav-content">
                    <a href="/index.html">Home</a>
                    <a href="/pages/about.html">About</a>
                    <a href="/pages/menu.html">Menu</a>
                    <a href="/pages/events.html">Events</a>
                    <a href="/pages/locations.html">Locations</a>
                    <a href="/pages/shop.html">Shop</a>
                    <a href="/pages/faq.html">FAQ</a>
                    <a href="/pages/contact.html">Contact</a>
                </div>
            </div>
            <h1> BILLY VAN CREAMY  </h1>
            <div class="search-cart">
                <div class="cart-icon-wrapper">
                    <img src="/assets/cart.svg" alt="Shopping Cart" onclick="openDrawer()" style="cursor:pointer;" />
                    <span id="cart-badge" style="display:none;">0</span>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <h1>Your Cart</h1>
        <div class="cart-layout">
            <div class="cart-items" id="cart-items"></div>
            <div class="cart-summary" id="cart-summary"></div>
        </div>
        <div id="cart-drawer" class="cart-drawer">
            <div class="cart-drawer-header">
                <h2>Your Cart</h2>
                <button class="drawer-close" onclick="closeDrawer()">✕</button>
            </div>
            <div id="cart-drawer-items" class="cart-drawer-items"></div>
            <div class="cart-drawer-footer">
                <a href="/pages/cart.html" class="view-cart-btn">View Cart</a>
            </div>
        </div>
        <div id="cart-overlay" class="cart-overlay" onclick="closeDrawer()"></div>
    </main>
    <script src="/scripts/scripts.js"></script>
</body>
</html>
